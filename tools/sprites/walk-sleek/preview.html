<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Walk Cycle</title>
<style>
  :root { --bg:#0f0f13; --card:#15151b; --line:#26262f; --fg:#d8d8e0; --dim:#8a8a98; --acc:#9bd46a; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 ui-monospace, "JetBrains Mono", Menlo, monospace; }
  header { position:sticky; top:0; z-index:1; background:var(--bg); padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:14px; margin:0 8px 0 0; color:var(--acc); }
  h2 { font-size:13px; margin:20px 16px 0; color:var(--dim); font-weight:normal; }
  button { background:#202028; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 9px; font:inherit; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--acc); color:#11140c; border-color:var(--acc); }
  .grid { padding:12px 16px; display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px; max-width:100%; overflow-x:auto; }
  .card h3 { margin:0 0 8px; font-size:12px; font-weight:normal; }
  .row { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
  .tracks { display:flex; flex-direction:column; align-items:flex-start; gap:8px; margin-top:12px; }
  .strip { display:flex; gap:4px; flex-wrap:wrap; margin-top:10px; }
  .strip figure { margin:0; text-align:center; color:var(--dim); font-size:10px; }
  .strip figure.on canvas { outline:1px solid var(--acc); }
  .strip figure.key { color:var(--fg); }
  canvas { display:block; image-rendering:pixelated; }
  output { color:var(--dim); }
</style>
</head>

</header>

function blit(c, px, pal, s, ox, alpha) {
  c.globalAlpha = alpha;
  px.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    c.fillStyle = pal[ch];
    c.fillRect((ox + x) * s, y * s, s, s);
  }));
  c.globalAlpha = 1;
}

function mk(w, h) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d');

function drawInPlace(v) {
  v.c.clearRect(0, 0, v.cv.width, v.cv.height);
  if (onion) blit(v.c, WALK.frames[prev()].px, v.pal, v.s, 0, 0.3);
  blit(v.c, WALK.frames[f].px, v.pal, v.s, 0, 1);
}

function drawTrack(v) {
  const c = v.c, s = v.s, span = TRACK + S.w;
  c.clearRect(0, 0, v.cv.width, v.cv.height);
  // World-fixed ground ticks: a planted paw must hold still against these.
  c.fillStyle = '#26262f';
  c.fillRect(0, 31 * s, TRACK * s, s);
  c.fillStyle = '#3a3a48';
  for (let x = 0; x < TRACK; x += 4) c.fillRect(x * s, 31 * s, s, s);
  const pos = ((step * TRAVEL) % span) - S.w;
  if (onion) blit(c, WALK.frames[prev()].px, v.pal, s, pos - TRAVEL, 0.3);
  blit(c, WALK.frames[f].px, v.pal, s, pos, 1);
}

function strip(card, pal) {
  const st = document.createElement('div');
  st.className = 'strip';
  const figs = WALK.frames.map((fr, i) => {
    const fig = document.createElement('figure');
    const [cv, c] = mk(S.w * 2, S.h * 2);
    blit(c, fr.px, pal, 2, 0, 1);
    if (i in KEYS) fig.className = 'key';
    fig.append(cv, `${i + 1} ${KEYS[i] || 'ib'}`);
    st.appendChild(fig);
    return fig;
  });
  card.appendChild(st);
  return figs;
}

const h = document.createElement('h2');
const total = WALK.frames.reduce((a, fr) => a + fr.ms, 0);
h.textContent = `walk · ${n} frames · ${total} ms loop · travel ${TRAVEL} px/frame`;
const grid = document.createElement('div');
grid.className = 'grid';
root.append(h, grid);
for (const [coat, pal] of Object.entries(S.palettes)) {
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = `<h3>${coat}</h3><div class="row"></div><div class="tracks"></div>`;
  for (const s of [1, 2, 4]) {
    const [cv, c] = mk(S.w * s, S.h * s);
    card.querySelector('.row').appendChild(cv);
    views.push({ cv, c, s, pal, draw: drawInPlace });
  }
  // The sitting idle beside the 4x walk, to compare body mass.
  const [sit, sc] = mk(S.w * 4, S.h * 4);
  blit(sc, S.animations.idle.frames[0].px, pal, 4, 0, 1);
  sit.title = 'idle (sitting), for mass comparison';
  card.querySelector('.row').appendChild(sit);
  for (const s of [1, 2, 4]) {
    const [cv, c] = mk(TRACK * s, S.h * s);
    card.querySelector('.tracks').appendChild(cv);
    views.push({ cv, c, s, pal, draw: drawTrack });
  }
  views.push({ figs: strip(card, pal), draw: v => v.figs.forEach((fg, i) => fg.classList.toggle('on', i === f)) });
  grid.appendChild(card);
}

const info = document.getElementById('info');
function show() {
  views.forEach(v => v.draw(v));
  info.textContent = `frame ${f + 1}/${n} ${KEYS[f] || 'in-between'} · ${WALK.frames[f].ms} ms`;
}
const btn = document.getElementById('pause');
const setPlay = p => { playing = p; btn.textContent = p ? 'pause' : 'play'; };
setPlay(playing);
btn.onclick = () => setPlay(!playing);
document.getElementById('step').onclick = () => { setPlay(false); f = (f + 1) % n; step++; t = 0; show(); };
document.getElementById('back').onclick = () => { setPlay(false); f = prev(); step--; t = 0; show(); };
const ob = document.getElementById('onion');
ob.onclick = () => { onion = !onion; ob.setAttribute('aria-pressed', onion); show(); };
show();
let last = performance.now();
(function loop(now) {
  const dt = Math.min(now - last, 250); last = now;
  if (playing) {
    t += dt;
    let moved = false;
    while (t >= WALK.frames[f].ms) { t -= WALK.frames[f].ms; f = (f + 1) % n; step++; moved = true; }
    if (moved) show();
  }
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
