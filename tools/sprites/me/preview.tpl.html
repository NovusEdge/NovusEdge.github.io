<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Portrait</title>
<style>
  :root { --bg: #0f0f13; --fg: #d8d6e0; --dim: #7c7890; --line: #26242f; --on: #4a4560; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, monospace; margin: 0; padding: 24px 16px; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 0; }
  legend { color: var(--dim); padding: 0 4px; }
  button { background: none; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; margin: 2px; }
  button[aria-pressed="true"] { background: var(--on); border-color: var(--on); }
  .stage { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
  .stage figure { margin: 0; text-align: center; color: var(--dim); }
  canvas { image-rendering: pixelated; display: block; }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; }
  .strip figure { margin: 0; color: var(--dim); font-size: 11px; text-align: center; }
  .strip canvas { outline: 1px solid var(--line); }
  .strip .cur canvas { outline-color: #8a84a8; }
  p.note { color: var(--dim); max-width: 70ch; }
</style>
</head>
<body>
<h1>pixel portrait: idle / walk / desk</h1>
<div class="bar">
  <fieldset id="anim"><legend>animation</legend></fieldset>
  <fieldset id="outfit"><legend>outfit</legend></fieldset>
  <fieldset id="skin"><legend>skin</legend></fieldset>
  <fieldset id="opts"><legend>options</legend></fieldset>
</div>
<div class="stage" id="stage"></div>
<div class="strip" id="strip"></div>
<p class="note" id="note"></p>
<script id="sprites" type="application/json">/*SPRITES*/</script>
<script>
const S = JSON.parse(document.getElementById('sprites').textContent);
const state = { anim: 'idle', outfit: 'sweater', skin: 'light', slot: false, walkAcross: true };
let t0 = performance.now(), frameIdx = 0, acc = 0, xoff = 0;

function pal() {
  return Object.assign({}, S.palette, S.palettes[state.skin], S.outfits[state.outfit].palette, S.props);
}
function dims(a) { return [a.w || S.w, a.h || S.h]; }
function compose(fr) {
  const rows = fr.px.map(r => r.split(''));
  for (const L of S.outfits[state.outfit].layers) {
    const lay = fr.layers && fr.layers[L];
    if (!lay) continue;
    lay.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] !== '.') rows[y][x] = r[x]; });
  }
  return rows;
}
function draw(cv, fr, scale, ox = 0) {
  const a = S.animations[state.anim], [w, h] = dims(a), P = pal(), c = cv.getContext('2d');
  c.imageSmoothingEnabled = false;
  c.fillStyle = '#0f0f13'; c.fillRect(0, 0, cv.width, cv.height);
  compose(fr).forEach((r, y) => r.forEach((ch, x) => {
    if (ch === '.') return;
    c.fillStyle = P[ch]; c.fillRect((x + ox) * scale, y * scale, scale, scale);
  }));
  if (state.slot && a.catSlot) {
    const [sx, sy, sw, sh] = a.catSlot;
    c.strokeStyle = '#9bd46a'; c.setLineDash([scale, scale]); c.lineWidth = 1;
    c.strokeRect(sx * scale + .5, sy * scale + .5, sw * scale - 1, sh * scale - 1);
  }
}
const live = [];
function buildStage() {
  const a = S.animations[state.anim], [w, h] = dims(a), st = document.getElementById('stage');
  st.innerHTML = ''; live.length = 0;
  for (const s of [1, 2, 4]) {
    const f = document.createElement('figure'), cv = document.createElement('canvas');
    const across = state.anim === 'walk' && state.walkAcross;
    cv.width = (across ? w * 4 : w) * s; cv.height = h * s;
    f.append(cv, document.createTextNode(s + 'x')); st.append(f); live.push({ cv, s });
  }
  const strip = document.getElementById('strip'); strip.innerHTML = '';
  a.frames.forEach((fr, i) => {
    const f = document.createElement('figure'), cv = document.createElement('canvas');
    cv.width = w * 2; cv.height = h * 2; draw(cv, fr, 2);
    f.append(cv, document.createTextNode(i + ' · ' + fr.ms + 'ms')); strip.append(f);
  });
  const total = a.frames.reduce((s, f) => s + f.ms, 0);
  document.getElementById('note').textContent =
    `${a.frames.length} frames, ${total} ms per loop.` + (a.catSlot ? ` catSlot [${a.catSlot}] is the empty desk space for the cat.` : '');
  frameIdx = 0; acc = 0; xoff = 0;
}
function tick(now) {
  const a = S.animations[state.anim], dt = now - t0; t0 = now; acc += dt;
  while (acc >= a.frames[frameIdx].ms) {
    acc -= a.frames[frameIdx].ms;
    xoff += a.frames[frameIdx].dx || 0;
    frameIdx = (frameIdx + 1) % a.frames.length;
  }
  const [w] = dims(a), across = state.anim === 'walk' && state.walkAcross;
  const ox = across ? (xoff % (w * 4 + w)) - w : 0;
  live.forEach(l => draw(l.cv, a.frames[frameIdx], l.s, ox));
  [...document.getElementById('strip').children].forEach((el, i) => el.classList.toggle('cur', i === frameIdx));
  requestAnimationFrame(tick);
}
function picker(id, keys, key, after) {
  const fs = document.getElementById(id);
  keys.forEach(k => {
    const b = document.createElement('button'); b.textContent = k;
    b.setAttribute('aria-pressed', state[key] === k);
    b.onclick = () => { state[key] = k; [...fs.querySelectorAll('button')].forEach(x => x.setAttribute('aria-pressed', x === b)); after(); };
    fs.append(b);
  });
}
function toggle(id, label, key) {
  const b = document.createElement('button'); b.textContent = label; b.setAttribute('aria-pressed', state[key]);
  b.onclick = () => { state[key] = !state[key]; b.setAttribute('aria-pressed', state[key]); buildStage(); };
  document.getElementById(id).append(b);
}
picker('anim', Object.keys(S.animations), 'anim', buildStage);
picker('outfit', Object.keys(S.outfits), 'outfit', buildStage);
picker('skin', Object.keys(S.palettes), 'skin', buildStage);
toggle('opts', 'show catSlot', 'slot');
toggle('opts', 'walk across', 'walkAcross');
buildStage();
requestAnimationFrame(tick);
</script>
</body>
</html>
