<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aliasgar Khimani | NovusEdge | Systems Architect</title>

    <!-- Open Graph -->
    <meta property="og:site_name" content="Aliasgar Khimani" />

    <!-- JSON-LD is generated per page at prerender: src/lib/structured-data.ts -->

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="NovusEdge" href="/feed.xml" />
    <script>
      (function () {
        var t = localStorage.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.classList.toggle('dark', t === 'dark')
        // Lets prerendered text that a script will animate start hidden instead of flashing.
        document.documentElement.classList.add('js')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- one family per request: the Fontshare API returns only the first f[] and silently
         drops the rest, so the combined request served zero Amulya @font-face rules and every
         font-display heading fell back to Zen Kaku Gothic New -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=amulya@400,500,700,900&display=swap"
      rel="stylesheet"
    />
    <script async src="https://scripts.withcabin.com/hello.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
